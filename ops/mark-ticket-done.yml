# Install (one-time; needs GitHub `workflow` scope or repo Settings → Actions):
#   mkdir -p .github/workflows
#   cp ops/mark-ticket-done.yml .github/workflows/mark-ticket-done.yml
#
# After a build/test PR squash-merges, flip matching tickets/*/T-*.md status → done.
# Parses T-NNN-NN from PR title, body, and head branch. Uses scripts/mark-ticket-done.sh.
# Kit-compatible: does not edit .sdlc/. Needs contents:write (default GITHUB_TOKEN).
name: mark-ticket-done

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  mark-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          # Need a token that can push follow-up commits to the default branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark ticket(s) done
        id: mark
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TEXT="${PR_TITLE}"$'\n'"${PR_BODY}"$'\n'"${PR_HEAD}"
          if ! ids="$(grep -oE 'T-[0-9]+-[0-9]+' <<<"$TEXT" | awk '!seen[$0]++')"; then
            ids=""
          fi
          if [[ -z "${ids}" ]]; then
            echo "No T-NNN-NN in PR title/body/branch; skip."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Ticket ids: ${ids}"
          # shellcheck disable=SC2086
          scripts/mark-ticket-done.sh ${ids}
          if git diff --quiet -- tickets/; then
            echo "No ticket file changes (already done)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "ids<<EOF"
              echo "$ids"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push status updates
        if: steps.mark.outputs.changed == 'true'
        env:
          IDS: ${{ steps.mark.outputs.ids }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One-line summary of ids for the commit subject
          id_list="$(echo "$IDS" | tr '\n' ' ' | xargs)"
          git add tickets/
          git commit -m "chore: mark ${id_list} done (merged #${PR_NUMBER})"
          # Rebase if another merge landed; retry once
          if ! git push origin "HEAD:${{ github.event.pull_request.base.ref }}"; then
            git pull --rebase origin "${{ github.event.pull_request.base.ref }}"
            git push origin "HEAD:${{ github.event.pull_request.base.ref }}"
          fi
