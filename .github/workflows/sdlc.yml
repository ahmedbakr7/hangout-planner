# Product CI: the same gate agents run locally, enforced on every PR.
# Installed by `sdlc init` as .github/workflows/sdlc.yml. Mark the "gate" job required
# in branch protection. Add the services/setup your stack needs (databases, browsers).
name: sdlc

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hangout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hangout
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0          # the gate diffs against the base branch
          # The kit (.sdlc) is a private repo: github.token can only read this one.
          # SDLC_KIT_TOKEN: fine-grained token, Contents read on this repo and the kit.
          token: ${{ secrets.SDLC_KIT_TOKEN || github.token }}
          persist-credentials: false   # do not leave the token in .git/config for later steps

      - name: DIAG after actions/checkout@v4
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - name: DIAG install git call logger
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitwrap"
          cat > "$RUNNER_TEMP/gitwrap/git" <<'SH'
          #!/bin/bash
          { printf '%s pid=%s ppid=%s cwd=%s parent=[%s] :: git' "$(date +%T.%N)" "$$" "$PPID" "$PWD" "$(tr '\0' ' ' < /proc/$PPID/cmdline 2>/dev/null | cut -c1-300)"; printf ' %q' "$@"; echo; } >> "$RUNNER_TEMP/gitcalls.log"
          exec /usr/bin/git "$@"
          SH
          chmod +x "$RUNNER_TEMP/gitwrap/git"
          echo "$RUNNER_TEMP/gitwrap" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: DIAG after actions/setup-python@v5
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: DIAG after actions/setup-node@v4
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - run: npm ci --no-audit --no-fund

      # ADR-0010: Chromium for the browser suite (commands.e2e). The cache key carries the
      # pinned @playwright/test version; a version bump changes the pin and this key together.
      - name: DIAG after npm ci --no-audit --no-fund
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}
      - name: DIAG after actions/cache@v4
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - run: npx --no-install playwright install --with-deps chromium

      - name: DIAG after npx --no-install playwright install --wi
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - name: Doctor (fails if any required check could pass vacuously)
        run: .sdlc/bin/sdlc doctor

      - name: DIAG after Doctor (fails if any required check coul
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - name: Gate (ci)
        run: .sdlc/bin/sdlc gate ci --base origin/${{ github.base_ref || 'main' }}

      - name: DIAG after Gate (ci)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - name: Trace (requirements -> tickets -> proven AC)
        if: ${{ !cancelled() }}   # still report the trace when gate ci is red
        run: .sdlc/bin/sdlc trace

      # Every PR is a ticket PR or a lead PR. `gate pr` finds the one ticket the branch moves
      # (its ticket, evidence or review file changed; status in_progress or later) and judges
      # the whole branch: every changed file is in one of that ticket's write sets, status
      # moved legally, and a done ticket has an approval that covers what is merged. A branch
      # that moves no ticket is a lead PR: files beyond lead artifacts (specs, plans,
      # CONTRACTS, tickets, ADRs, sdlc.toml, scope.lead_allowed) are reported, and fail
      # only with scope.lead_code = "fail".
      - name: DIAG after Trace (requirements -> tickets -> proven
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - name: PR gate (the ticket this PR moves, or lead scope)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: .sdlc/bin/sdlc gate pr --base origin/${{ github.base_ref }}

      - name: DIAG after PR gate (the ticket this PR moves, or le
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          echo "commits=$(git rev-list --count origin/main) trailers=$(git log --format='%(trailers:key=Sdlc-Ticket,valueonly)' origin/main | grep -c T-001)"
          ls -la .git/shallow .git/info/grafts 2>&1 | head -3; git replace -l | head -3
          git config --show-origin -l | grep -v -i 'token\|extraheader\|url\.' | head -40
          env | grep -i '^GIT_' | sed 's/=.*/=…/'
          git rev-parse --is-shallow-repository
          git -c core.commitGraph=false rev-list --count origin/main
          git --no-replace-objects rev-list --count origin/main
          git cat-file -p be646ff | grep ^parent
          ls -la .git/objects/info .git/objects/info/commit-graphs 2>/dev/null
          git commit-graph verify; echo "cg rc=$?"
          git config --show-origin --get-all core.commitGraph; git config --show-origin --get-regexp '^(gc|maintenance|fetch)\.'
          true

      - name: DIAG git calls that can make the repo shallow
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          wc -l "$RUNNER_TEMP/gitcalls.log"
          grep -n -E 'fetch|clone|shallow|depth|deepen|graft|replace|pull|submodule|gc|maintenance|commit-graph|repack|prune' "$RUNNER_TEMP/gitcalls.log" | cut -c1-600 | head -80
          echo "--- distinct parents"; sed -E 's/.*parent=\[([^]]*)\].*/\1/' "$RUNNER_TEMP/gitcalls.log" | cut -c1-160 | sort | uniq -c | sort -rn | head -40
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdlc-run
          path: .sdlc-run/
          include-hidden-files: true   # v4 skips dot-folders by default: the evidence was never uploaded
