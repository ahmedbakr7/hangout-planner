# sdlc.toml: how the kit runs checks in this product.
# Every key below overrides the profile (.sdlc/profiles/<profile>.toml) and kit defaults.
# Run `.sdlc/bin/sdlc doctor` after editing: it fails if a gate could pass vacuously.
version = 1
profile = "nextjs"

[commands]
# Each is a shell command run from the repo root. Exit code 0 = pass.
# {junit} = path the gate reads to map tests to acceptance criteria (required for unit/integration/e2e).
# Every test command needs DATABASE_URL (a Postgres the tests may migrate and truncate).
# `lint` runs `tsc` with the typecheck config (tests excluded), then `eslint . --max-warnings 0` (T-001-52).
lint = "npm run --silent lint"
# typecheck, unit, build, start: nextjs profile defaults (typecheck uses tsconfig.json, which includes tests).
# e2e/*.e2e.ts call route handlers in-process under jsdom (no HTTP); the test:e2e script cannot take
# reporter flags, so the gate runs them through vitest.e2e.config.mts (same settings as test:e2e).
integration = "npx --no-install vitest run --config vitest.e2e.config.mts --reporter=default --reporter=junit --outputFile.junit={junit}"
# ADR-0010: the Playwright browser suite (browser/*.spec.ts) over HTTP against `next start` on 3124,
# with the Google stub on 3125 (playwright.config.ts starts both). Browsers come from
# PLAYWRIGHT_BROWSERS_PATH in agent containers and `playwright install` in CI.
e2e = "PLAYWRIGHT_JUNIT_OUTPUT_NAME={junit} npx --no-install playwright test --reporter=junit"
# jscpd is not a devDependency; pinned here until it is. Threshold ratchets down as clones are
# removed: 10 at the 2026-10-02 baseline (9.7%), 9 on 2026-10-23 (8.6% after roadmap item 10).
duplication = "npx --yes jscpd@4.3.0 --min-lines 12 --threshold 9 --gitignore --ignore \"**/*.test.*,**/*.spec.*\" src"

[routes]
# extractor = "nextjs-app"   # or "command" with command = "<prints METHOD /path lines>"

[client]
# patterns = [] ; globs = [] ; prefix = "/"   (calls from UI code that must hit a contract route)

[tests]
# ADR-0010: a ticket is proven through the real stack by the in-process Vitest suite (integration)
# or by the Playwright browser suite over HTTP against `next start` (e2e).
real_stack = ["integration", "e2e"]
# ADR-0010: browser/ holds the Playwright specs and their support files. The nextjs profile
# defaults are listed in full because a key set here replaces the profile value.
globs = ["**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "e2e/**", "browser/**"]   # which files are tests
integration_globs = ["e2e/**", "tests/**", "**/*.int.test.ts", "**/*.int.test.tsx", "browser/**"]   # what the test play may write
# forbid = [ { regex = "", message = "" } ]

[approval]
# ADR-0001 records mode: approvals are PR reviews/comments bound to the reviewed commit, evidence
# stays in CI, and ticket status derives from merged Sdlc-Ticket trailers.
mode = "forge"
# One account opens, reviews and leads here, so roles are taken on trust (write access is still
# required) and every result says "trust-based". Drop this once reviewers have their own identities.
trust_unsigned = true
# Forge repo for `sdlc review publish` outside CI (CI sets GITHUB_REPOSITORY).
repo = "ahmedbakr7/hangout-planner"

[scope]
# always_allowed = []        # globs any play may touch (lockfiles, snapshots)
lead_allowed = ["docs/**"]   # globs a PR that moves no ticket may change besides lead artifacts
lead_code = "fail"           # other files in such a PR: "warn" (reported) or "fail" (code needs a ticket)

[app]
# ADR-0013 (kit v5.1.0): smoke picks a free port per run, so two gates on one machine need no
# SDLC_APP_PORT. Every gate command sees the port as SDLC_APP_PORT. The browser suite keeps its
# own ports (ADR-0012: HP_E2E_APP_PORT, HP_E2E_GOOGLE_STUB_PORT).
port = "auto"
# ADR-0014 and ADR-0015: each gate run gets its own database (hp_run_<SDLC_RUN_ID>) on the server
# DATABASE_URL names, and its own browser-test ports. Setup appends DATABASE_URL, HP_E2E_APP_PORT
# and HP_E2E_GOOGLE_STUB_PORT to $SDLC_RUN_ENV; teardown drops the database, pass or fail.
setup = "node scripts/run-env.mjs setup"
teardown = "node scripts/run-env.mjs teardown"

[vcs]
base = "main"
# ADR-0013 (kit v4.1.0): `sdlc run build` fetches origin and pushes the ticket branch with an
# empty `claim <id>` commit before the agent runs, so a second run on the same ticket is refused.
claim = "push"
# A branch with no commit for 7 days stops holding its ticket (`sdlc status` shows it expired).
claim_days = 7
# pr_command = ""            # e.g. "gh pr create --fill --base {base} --head {branch}"

[gate]
max_attempts = 3

# Agents `sdlc run` can drive. The kit ships none: you decide what each agent may do.
# command placeholders: {instruction} (one line: read the prompt file and follow it),
# {prompt_file} (repo-relative path). See .sdlc/adapters/AGENTS-RUNNER.md.
#
# All three are headless Claude Code (`claude -p`), each a fresh process with no prior context.
# Permissions (lead decision of 2026-10-11, recorded in docs/hangout-roadmap.md "Running it"): file tools plus the kit CLI, the product's test and
# type-check commands, and read-only git. No MCP servers (--strict-mcp-config with none given),
# no network tools, no git writes: the runner makes every commit. A tool outside the list is
# denied, not prompted. The reviewer has no Edit tool but keeps Write, which it needs for its
# review record; that it writes nothing else rests on its prompt and on the review gate's write set.
# Models: set SDLC_BUILD_MODEL / SDLC_TEST_MODEL / SDLC_REVIEW_MODEL to pick each agent's model;
# unset means the CLI default. Give the reviewer a different model from the builder.
# Every play needs DATABASE_URL (see "Running it" in docs/hangout-roadmap.md).
[agents.builder]
command = "claude -p {instruction} ${SDLC_BUILD_MODEL:+--model \"$SDLC_BUILD_MODEL\"} --permission-mode acceptEdits --strict-mcp-config --no-session-persistence --allowedTools Read Edit Write Glob Grep 'Bash(.sdlc/bin/sdlc:*)' 'Bash(npm test:*)' 'Bash(npm run --silent lint)' 'Bash(npm run typecheck)' 'Bash(npx --no-install vitest:*)' 'Bash(npx --no-install tsc:*)' 'Bash(git status:*)' 'Bash(git diff:*)' 'Bash(git log:*)' 'Bash(git show:*)'"
timeout = 3600

# fe-builder (lead decision of 2026-10-14): the builder's tools plus Next.js's built-in MCP
# server (read-only diagnostics such as get_routes, get_errors, get_logs, compile_route).
# ops/agent-fe-builder.sh starts `next dev` on 127.0.0.1:3210 for the run and stops it on exit;
# nothing is downloaded (`next` is a locked dependency). The launcher is in ops/, a lead-only
# path, so no ticket PR can widen this agent. Use it for frontend tickets; review stays `reviewer`.
[agents.fe-builder]
command = "bash ops/agent-fe-builder.sh {instruction}"
timeout = 3600

[agents.tester]
command = "claude -p {instruction} ${SDLC_TEST_MODEL:+--model \"$SDLC_TEST_MODEL\"} --permission-mode acceptEdits --strict-mcp-config --no-session-persistence --allowedTools Read Edit Write Glob Grep 'Bash(.sdlc/bin/sdlc:*)' 'Bash(npm test:*)' 'Bash(npm run --silent lint)' 'Bash(npm run typecheck)' 'Bash(npx --no-install vitest:*)' 'Bash(npx --no-install tsc:*)' 'Bash(git status:*)' 'Bash(git diff:*)' 'Bash(git log:*)' 'Bash(git show:*)' 'Bash(npx --no-install playwright test:*)'"
timeout = 3600

[agents.reviewer]
command = "claude -p {instruction} ${SDLC_REVIEW_MODEL:+--model \"$SDLC_REVIEW_MODEL\"} --permission-mode acceptEdits --strict-mcp-config --no-session-persistence --allowedTools Read Write Glob Grep 'Bash(.sdlc/bin/sdlc:*)' 'Bash(npm test:*)' 'Bash(npx --no-install vitest:*)' 'Bash(git status:*)' 'Bash(git diff:*)' 'Bash(git log:*)' 'Bash(git show:*)' 'Bash(npx --no-install playwright test:*)'"
timeout = 1800
