# sdlc.toml: how the kit runs checks in this product.
# Every key below overrides the profile (.sdlc/profiles/<profile>.toml) and kit defaults.
# Run `.sdlc/bin/sdlc doctor` after editing: it fails if a gate could pass vacuously.
version = 1
profile = "nextjs"

[commands]
# Each is a shell command run from the repo root. Exit code 0 = pass.
# {junit} = path the gate reads to map tests to acceptance criteria (required for unit/integration/e2e).
# Every test command needs DATABASE_URL (a Postgres the tests may migrate and truncate).
# Hangout has no linter: its `lint` script is `tsc` with the typecheck config (tests excluded).
lint = "npm run --silent lint"
# typecheck, unit, build, start: nextjs profile defaults (typecheck uses tsconfig.json, which includes tests).
# e2e/*.e2e.ts call route handlers in-process under jsdom (no HTTP); the test:e2e script cannot take
# reporter flags, so the gate runs them through vitest.e2e.config.mts (same settings as test:e2e).
integration = "npx --no-install vitest run --config vitest.e2e.config.mts --reporter=default --reporter=junit --outputFile.junit={junit}"
# jscpd is not a devDependency; pinned here until it is.
duplication = "npx --yes jscpd@4.3.0 --min-lines 12 --threshold 2 --gitignore --exitCode 1 src"

[routes]
# extractor = "nextjs-app"   # or "command" with command = "<prints METHOD /path lines>"

[client]
# patterns = [] ; globs = [] ; prefix = "/"   (calls from UI code that must hit a contract route)

[tests]
# globs = []                 # which files are tests
# integration_globs = []     # what the test play may write
# forbid = [ { regex = "", message = "" } ]

[scope]
# always_allowed = []        # globs any play may touch (lockfiles, snapshots)
# lead_allowed = []          # globs a PR that moves no ticket may change besides lead artifacts
# lead_code = "warn"         # other files in such a PR: "warn" (reported) or "fail" (code needs a ticket)

[vcs]
base = "main"
# pr_command = ""            # e.g. "gh pr create --fill --base {base} --head {branch}"

[gate]
max_attempts = 3

# Agents `sdlc run` can drive. The kit ships none: you decide what each agent may do.
# command placeholders: {instruction} (one line: read the prompt file and follow it),
# {prompt_file} (repo-relative path). See .sdlc/adapters/AGENTS-RUNNER.md.
# [agents.myagent]
# command = "my-agent-cli {instruction}"
# timeout = 3600
